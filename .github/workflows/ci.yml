name: Light numerical CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  light-tests:
    name: Python ${{ matrix.python }} / ${{ matrix.mp_backend }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        mp_backend: ["python", "gmpy"]
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      EXPECTED_MPMATH_BACKEND: ${{ matrix.mp_backend }}
      CI_ARTIFACT_DIR: ci-artifacts
      PYTHONWARNINGS: >-
        error:Conversion of an array with ndim > 0 to a scalar is deprecated:DeprecationWarning
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install validated test dependencies
        run: |
          mkdir -p "$CI_ARTIFACT_DIR"
          # Keep these here until the project requirements are reviewed.
          python -m pip install \
            numpy==2.3.5 scipy==1.18.0 matplotlib==3.10.6 \
            mpmath==1.3.0 gmpy2==2.2.1 matplotlib-inline==0.2.1 \
            ipython==9.7.0 ipykernel==6.31.0
      - name: Select Python mpmath backend
        if: matrix.mp_backend == 'python'
        run: echo "MPMATH_NOGMPY=1" >> "$GITHUB_ENV"
      - name: Verify environment
        run: |
          python -m pip check
          python --version
          python -m pip freeze > "$CI_ARTIFACT_DIR/dependencies.txt"
          python - <<'PY'
          import os
          import mpmath

          actual = mpmath.libmp.BACKEND
          expected = os.environ["EXPECTED_MPMATH_BACKEND"]
          print(f"mpmath backend: {actual}")
          assert actual == expected, (actual, expected)
          PY
      - name: Run lightweight tests
        shell: bash
        run: |
          set -o pipefail
          # Explicit modules keep the original heavy sweeps out of CI.
          python -B -m unittest -v \
            test_solution_persistence test_scipy_solver test_l2_error \
            test_manufactured_linear_light test_manufactured_nonlinear_light \
            test_plotting_light \
            2>&1 | tee "$CI_ARTIFACT_DIR/tests.log"
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.python }}-${{ matrix.mp_backend }}-attempt-${{ github.run_attempt }}
          path: ci-artifacts/
          if-no-files-found: ignore
          retention-days: 7
