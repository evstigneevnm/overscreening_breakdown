name: Package and numerical CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build:
    name: Correctness lint and distributions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install build and development tools
        run: |
          python -m pip install "build>=1.2,<2" "ruff>=0.12,<0.13" "pre-commit>=4,<5" "virtualenv<21" "packaging>=24,<26"
      - name: Check source correctness and hook configuration
        run: |
          python -m ruff check src tests examples benchmarks
          python -m pre_commit validate-config
      - name: Build source archive and wheel
        run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  light-tests:
    name: Python ${{ matrix.python }} / ${{ matrix.mp_backend }}
    needs: lint-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        mp_backend: ["python", "gmpy"]
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      EXPECTED_MPMATH_BACKEND: ${{ matrix.mp_backend }}
      CI_ARTIFACT_DIR: ci-artifacts
      PYTHONWARNINGS: >-
        error:Conversion of an array with ndim > 0 to a scalar is deprecated:DeprecationWarning
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: wheelhouse
      - name: Install validated dependencies and built wheel
        run: |
          mkdir -p "$CI_ARTIFACT_DIR"
          python -m pip install -r requirements.txt
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          wheels = list(Path("wheelhouse").glob("*.whl"))
          assert len(wheels) == 1, wheels
          subprocess.check_call([sys.executable, "-m", "pip", "install", str(wheels[0])+"[test]"])
          PY
      - name: Select Python mpmath backend
        if: matrix.mp_backend == 'python'
        run: echo "MPMATH_NOGMPY=1" >> "$GITHUB_ENV"
      - name: Verify environment
        run: |
          python -m pip check
          python --version
          python -m pip freeze > "$CI_ARTIFACT_DIR/dependencies.txt"
          python - <<'PY'
          from importlib.metadata import version
          import os
          from pathlib import Path
          import sys

          import mpmath
          import overscreening_breakdown
          from overscreening_breakdown import BSKProblem, FluxProblem, solve
          from overscreening_breakdown.problems.bsk_problem import BSKProblem as CanonicalBSKProblem

          actual = mpmath.libmp.BACKEND
          expected = os.environ["EXPECTED_MPMATH_BACKEND"]
          assert actual == expected, (actual, expected)
          installed = Path(overscreening_breakdown.__file__).resolve()
          source = Path("src").resolve()
          assert source not in installed.parents, installed
          assert BSKProblem is CanonicalBSKProblem
          assert callable(solve) and callable(FluxProblem)
          if sys.version_info < (3, 10):
              import pytest_subtests
          print("mpmath backend:", actual)
          print("installed distribution:", version("overscreening-breakdown"))
          print("installed package:", installed)
          PY
      - name: Run lightweight tests
        shell: bash
        run: |
          set -o pipefail
          coverage_args=()
          if [[ "$EXPECTED_MPMATH_BACKEND" == gmpy ]] && python -c 'import sys; raise SystemExit(sys.version_info[:2] != (3, 13))'; then
            coverage_args=(--cov=overscreening_breakdown --cov-branch --cov-config="$PWD/pyproject.toml" --cov-report=term --cov-report="xml:$CI_ARTIFACT_DIR/coverage.xml")
          fi
          python -B -m pytest -v "${coverage_args[@]}" \
            --junitxml="$CI_ARTIFACT_DIR/junit.xml" \
            2>&1 | tee "$CI_ARTIFACT_DIR/tests.log"
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.python }}-${{ matrix.mp_backend }}-attempt-${{ github.run_attempt }}
          path: ci-artifacts/
          if-no-files-found: ignore
          retention-days: 7
