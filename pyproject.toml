[build-system]
requires = ["setuptools>=77", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "overscreening-breakdown"
version = "0.1.0"
description = "Collocation and mixed Galerkin solvers for half-line overscreening flux problems"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
]
# Keep the runtime selection aligned with requirements.txt's validated pins.
dependencies = [
  "numpy==2.0.2; python_version == '3.9'",
  "numpy==2.2.6; python_version == '3.10'",
  "numpy==2.3.5; python_version >= '3.11'",
  "scipy==1.13.1; python_version == '3.9'",
  "scipy==1.15.3; python_version == '3.10'",
  "scipy==1.16.3; python_version == '3.11'",
  "scipy==1.18.0; python_version >= '3.12'",
  "matplotlib==3.9.4; python_version == '3.9'",
  "matplotlib==3.10.6; python_version >= '3.10'",
  "mpmath==1.3.0",
]

[project.optional-dependencies]
gmpy = ["gmpy2==2.2.1"]
notebook = [
  "ipython==8.18.1; python_version == '3.9'",
  "ipython==8.37.0; python_version == '3.10'",
  "ipython==9.7.0; python_version >= '3.11'",
  "ipykernel==6.31.0",
  "matplotlib-inline==0.2.1",
]
test = [
  "pytest>=8.4,<9; python_version < '3.10'",
  "pytest-subtests>=0.14,<0.16; python_version < '3.10'",
  "pytest>=9,<10; python_version >= '3.10'",
  "pytest-cov>=5,<7",
  # Inline plotting tests exercise the same notebook stack as the examples.
  "ipython==8.18.1; python_version == '3.9'",
  "ipython==8.37.0; python_version == '3.10'",
  "ipython==9.7.0; python_version >= '3.11'",
  "ipykernel==6.31.0",
  "matplotlib-inline==0.2.1",
]
dev = [
  "build>=1.2,<2",
  "ruff>=0.12,<0.13",
  "pre-commit>=3.8,<4; python_version < '3.10'",
  "pre-commit>=4,<5; python_version >= '3.10'",
  # Keep development installs compatible with the validated Anaconda stack.
  "virtualenv>=20.10,<21",
  "packaging>=24,<26",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["overscreening_breakdown*"]
namespaces = false

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-config --strict-markers -m 'not slow'"
markers = [
  "slow: opt-in expensive sweeps excluded from the default suite",
  "manufactured: manufactured-solution numerical checks",
  "plotting: plot and notebook rendering checks",
  "example: runnable user example checks",
]
filterwarnings = [
  "error:Conversion of an array with ndim > 0 to a scalar is deprecated:DeprecationWarning",
]
junit_family = "xunit2"

[tool.coverage.run]
source = ["overscreening_breakdown"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["experiments", "*.ipynb"]

[tool.ruff.lint]
# Start with correctness checks; formatting/style migration is a later change.
select = ["E9", "F63", "F7", "F82"]
